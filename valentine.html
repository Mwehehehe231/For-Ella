<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>See You at Movie Night!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #ffccd5;
            margin: 50px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
        }
        h1 {
            color: #d63384;
        }
        img {
            width: 200px;
            margin-top: 10px;
        }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            background-color: #d63384;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #b0236a;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>See you at Feb 14 Movie Night! 🎬🍿</h1>
        <p>Can’t wait to spend the evening with you! ❤️</p>
        <img src="https://c.tenor.com/0jDvy_gaK7EAAAAC/milk-bear-sending-hearts.gif" alt="Cute Valentine">
        <br>
        <a href="index.html" class="btn">Look At This Please!</a>
    </div>

</body>
</html>
